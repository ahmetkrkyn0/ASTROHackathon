[pytest]
# These two files are standalone check-harness scripts, not pytest modules:
# importing them at collection time would execute their checks and hit
# sys.exit(). They are still RUN, as subprocesses, by test_legacy_harness.py --
# so the 65 assertions inside them are part of the suite again rather than
# being skipped entirely. (Backend review, #18.)
addopts = --ignore=test_cost_engine.py --ignore=test_traversability.py
